name: "CI"
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      FLAKEHUB_API_TOKEN: ${{ secrets.FLAKEHUB_API_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@main
      with:
        use-flakehub: true

    - name: Run flake checks (Linux only)
      run: nix flake check

    - name: Build default package
      run: nix build

    - name: Check overlays evaluate
      run: |
        nix eval .#overlays.ollama-cuda --apply 'x: "overlay-evaluates"'
        nix eval .#overlays.gpu-tools --apply 'x: "overlay-evaluates"'

    - name: Verify templates
      run: |
        rm -rf /tmp/template-test/p40 /tmp/template-test/p40-binaries
        mkdir -p /tmp/template-test/p40 /tmp/template-test/p40-binaries
        cd /tmp/template-test/p40
        nix flake init -t ${GITHUB_WORKSPACE}#tesla-p40
        nix flake check
        cd /tmp/template-test/p40-binaries
        nix flake init -t ${GITHUB_WORKSPACE}#tesla-p40-binaries
        nix flake check

  evaluation-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - gpu: P40
            package: ollama-cuda-tesla-p40
          - gpu: M40
            package: ollama-cuda-tesla-maxwell
          - gpu: K80
            package: ollama-cuda-tesla
    steps:
    - uses: actions/checkout@v4
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: DeterminateSystems/magic-nix-cache-action@main
    - name: Check package evaluation for ${{ matrix.gpu }}
      run: nix eval .#packages.x86_64-linux.${{ matrix.package }} --apply 'x: "eval-ok"'
